<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KFS Signage Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* ---- KFS Signage Player — universal web client -------------------------
   * Works on ANY device with a browser: desktop, tablet, phone,
   * Fire TV (Silk), Android TV, Raspberry Pi kiosk, Cast devices.
   * Usage:  http://<server>/content/player.html?server=10.1.10.238:8080&tv=menu1
   *         (server defaults to this host, tv defaults to "menu1")
   * The Tizen app (tizen-app/) is the native route for Samsung TVs; this
   * page is the universal route for everything else. Both speak the same
   * /scene/<tv> protocol. ------------------------------------------------ */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#071f10; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#071f10; }
  #stage img { max-width:100%; max-height:100%; object-fit:contain; }
  #stage video { width:100%; height:100%; object-fit:contain; }
  #stage .frame { width:100%; height:100%; border:0; background:#071f10; }
  #menu { display:none; width:100%; height:100%; flex-direction:column; padding:3% 4%;
          background:linear-gradient(160deg,#0a2e18 0%,#071f10 100%); color:#f5e9c8; overflow:hidden; }
  #menu .header { text-align:center; font-size:clamp(28px,5.5vh,64px); font-weight:800;
                  letter-spacing:.08em; text-transform:uppercase;
                  background:linear-gradient(180deg,#ffe9a8,#d4a017); -webkit-background-clip:text; background-clip:text; color:transparent;
                  padding-bottom:2vh; border-bottom:2px solid rgba(212,160,23,.5); }
  #menu .items { flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4vh; padding:2vh 2%;
                 font-size:clamp(18px,3vh,34px); }
  #menu .item { display:flex; align-items:baseline; gap:10px; }
  #menu .item span:first-child { flex:0 0 auto; }
  #menu .dots { flex:1; border-bottom:2px dotted rgba(245,233,200,.35); }
  #menu .price { font-weight:700; color:#ffd700; font-variant-numeric:tabular-nums; }
  #menu .footer { text-align:center; font-size:clamp(14px,2.2vh,24px); color:#c9b783; padding-top:1.5vh; }
  #offline { display:none; position:fixed; inset:0; z-index:99; align-items:center; justify-content:center;
             background:rgba(7,31,16,.94); color:#e8b0a0; font-size:clamp(18px,4vh,36px); text-align:center; letter-spacing:.05em; }
  #status { position:fixed; left:10px; bottom:6px; z-index:100; color:rgba(255,255,255,.35);
            font-size:12px; font-family:Consolas,monospace; }
</style>
</head>
<body>
<div id="stage"><div id="menu"><div class="header">MENU</div><div class="items"></div><div class="footer"></div></div></div>
<div id="offline">⚠ NO SIGNAL — CHECK DISPLAY SERVER</div>
<div id="status"></div>
<script>
(function () {
  "use strict";
  function qs(p){ return new URLSearchParams(location.search).get(p); }
  var SERVER  = (qs("server") || location.hostname + ":" + (location.port || "8080"));
  if (!/^https?:\/\//i.test(SERVER)) SERVER = "http://" + SERVER;
  var TV_ID   = qs("tv") || "menu1";
  var POLL_MS = 3000;

  var stage = document.getElementById("stage");
  var menuEl = document.getElementById("menu");
  var offlineEl = document.getElementById("offline");
  var statusEl = document.getElementById("status");
  var current = null, offline = false;

  function setStatus(s){ statusEl.textContent = s; }
  function showOffline(on){ if(on===offline) return; offline=on; offlineEl.style.display = on ? "flex" : "none"; }
  function clearStage(){ stage.innerHTML = ""; menuEl.style.display = "none"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function renderImage(url){ clearStage(); var i=document.createElement("img"); i.src=url; stage.appendChild(i); }
  function renderVideo(url,loop){ clearStage(); var v=document.createElement("video");
    v.src=url; v.autoplay=true; v.loop=loop!==false; v.muted=true; v.playsInline=true; stage.appendChild(v); v.play().catch(function(){}); }
  function renderMenu(data){ clearStage(); menuEl.style.display="flex";
    menuEl.querySelector(".header").textContent = esc(data.title||"MENU");
    var items = menuEl.querySelector(".items"); items.innerHTML="";
    (data.items||[]).forEach(function(it){
      var row=document.createElement("div"); row.className="item";
      row.innerHTML = "<span>"+esc(it.name)+"</span><span class='dots'></span><span class='price'>"+esc(it.price)+"</span>";
      items.appendChild(row);
    });
    menuEl.querySelector(".footer").textContent = esc(data.footer||""); }
  function renderUrl(url){ clearStage(); var source=String(url||"");
    var target = /^https?:\/\//i.test(source) ? source : SERVER+"/content/"+source.split("/").map(encodeURIComponent).join("/");
    setStatus("loading page: "+target);
    var f=document.createElement("iframe"); f.className="frame"; f.src=target; stage.appendChild(f); }

  function applyScene(scene){
    if(!scene||!scene.type) return;
    if(current && current.type===scene.type && current.src===scene.src && current.title===scene.title) return;
    current=scene;
    switch(scene.type){
      case "image": renderImage(SERVER+"/content/"+scene.src); break;
      case "video": renderVideo(SERVER+"/content/"+scene.src, scene.loop); break;
      case "menu":  renderMenu(scene); break;
      case "url":   renderUrl(scene.src); break;
      case "blank": clearStage(); break;
    }
    setStatus("KFS player "+TV_ID+" — scene: "+scene.type);
  }

  function poll(){
    var xhr=new XMLHttpRequest();
    xhr.open("GET", SERVER+"/scene/"+TV_ID+"?t="+Date.now(), true);
    xhr.timeout=5000;
    xhr.onload=function(){
      if(xhr.status===200){ showOffline(false);
        try{ applyScene(JSON.parse(xhr.responseText.replace(/^\uFEFF/,""))); }
        catch(e){ setStatus("bad scene JSON"); } }
      else showOffline(true);
    };
    xhr.onerror=function(){ showOffline(true); };
    xhr.ontimeout=function(){ showOffline(true); };
    xhr.send();
  }
  setInterval(poll, POLL_MS); poll();
  setStatus("KFS player "+TV_ID+" — connecting to "+SERVER);
})();
</script>
</body>
</html>
